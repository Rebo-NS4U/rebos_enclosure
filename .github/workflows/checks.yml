name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install native test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git python python-pillow python-gobject gtk4 ruff
          gcc pkgconf fish fontconfig
          niri quickshell qt6-multimedia-ffmpeg ttf-dejavu nodejs lua51
          ffmpeg vlc vlc-plugin-ffmpeg vlc-plugin-freetype vlc-plugin-lua
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare unprivileged test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Show native tool versions
        run: |
          python --version
          niri --version
          qs --version
          ffmpeg -version | head -n 1
      - name: Verify installer payload
        run: runuser -u ci -- python desktop/scripts/deploy.py --verify
      - name: Lint Python for runtime errors
        run: runuser -u ci -- ruff check --no-cache desktop system
      - name: Build native helpers
        run: runuser -u ci -- bash desktop/scripts/build-check.sh
      - name: Check installer shell syntax
        run: |
          for script in install.sh desktop/install.sh oneline.sh desktop/scripts/finish-apps.sh docs/restore-windows-vm-passthrough.sh docs/windows-vm-passthrough/*.sh; do
            runuser -u ci -- bash -n "$script"
          done
      - name: Run desktop tests
        run: runuser -u ci -- python -m unittest discover -s desktop/tests -v
      - name: Run media tests
        env:
          PYTHONPATH: system/apps/media
        run: runuser -u ci -- python -m unittest discover -s desktop/tests/media -v

name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install Pillow
      - name: Verify installer payload
        run: python desktop/scripts/deploy.py --verify
      - name: Check installer shell syntax
        run: bash -n install.sh desktop/install.sh oneline.sh desktop/scripts/finish-apps.sh
      - name: Run desktop tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Run media tests
        env:
          PYTHONPATH: system/apps/media
        run: python -m unittest discover -s desktop/tests/media -v

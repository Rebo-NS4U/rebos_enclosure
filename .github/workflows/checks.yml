name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install native test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git python python-pip python-pillow python-gobject python-charset-normalizer gtk4 cage ruff
          gcc pkgconf fish fontconfig poppler yt-dlp
          niri quickshell qt6-multimedia-ffmpeg ttf-dejavu nodejs lua51 xorg-server-xvfb mesa
          ffmpeg vlc vlc-plugin-ffmpeg vlc-plugin-freetype vlc-plugin-lua vlc-plugin-dvb
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare unprivileged test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Show native tool versions
        run: |
          python --version
          niri --version
          qs --version
          ffmpeg -version | head -n 1
      - name: Verify installer payload
        run: runuser -u ci -- python desktop/scripts/deploy.py --verify
      - name: Lint Python for runtime errors
        run: runuser -u ci -- ruff check --no-cache desktop system
      - name: Check design warnings and exception ceilings
        run: |
          python -m venv /tmp/enclosure-quality-ci
          /tmp/enclosure-quality-ci/bin/pip install pylint==4.1.3
          runuser -u ci -- /tmp/enclosure-quality-ci/bin/python desktop/scripts/quality.py
      - name: Build native helpers
        run: runuser -u ci -- bash desktop/scripts/build-check.sh
      - name: Check installer shell syntax
        run: |
          for script in install.sh desktop/install.sh oneline.sh desktop/scripts/finish-apps.sh docs/restore-windows-vm-passthrough.sh docs/windows-vm-passthrough/*.sh; do
            runuser -u ci -- bash -n "$script"
          done
      - name: Verify committed release archive and file recovery
        run: |
          runuser -u ci -- python desktop/scripts/snapshot.py --output /tmp/enclosure-ci.tar.gz
          runuser -u ci -- python desktop/scripts/check_release.py /tmp/enclosure-ci.tar.gz
      - name: Run desktop tests
        run: runuser -u ci -- python -m unittest discover -s desktop/tests -v
      - name: Run isolated Wayland screenshot acceptance
        run: runuser -u ci -- python desktop/scripts/check_wayland.py
      - name: Run media tests
        env:
          PYTHONPATH: system/apps/media
        run: runuser -u ci -- python -m unittest discover -s desktop/tests/media -v
      - name: Run shell, assistant, connectivity and Lua regressions
        run: |
          runuser -u ci -- python -m unittest discover -s system/apps/shell/scripts -p 'test_*.py' -v
          runuser -u ci -- python -m unittest discover -s system/apps/assistant/scripts -p 'test_*.py' -v
          runuser -u ci -- node --test desktop/tests/*.cjs system/apps/shell/scripts/test_*.cjs
          runuser -u ci -- lua5.1 desktop/tests/media/test_vlc_caption_anchor.lua

include colors.conf


# remove predefined shortcuts
clear_all_shortcuts yes

# cursor
cursor_shape beam
cursor_blink_interval 0.55 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail 100
cursor_trail_decay 0.08 0.18
cursor_trail_start_threshold 3

# terminal
term xterm-256color
shell /usr/bin/fish
shell_integration enabled

# scrolling
scrollback_lines 10000
scrollback_pager_history_size 32
scrollback_pager less --RAW-CONTROL-CHARS --ignore-case --incsearch +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 6.0

# selection
copy_on_select clipboard
select_by_word_characters :,│`|:\"'()[]{}<>\t

# window

background_opacity 0.7
background_blur 0
window_padding_width 10 10
window_margin_width 0

# keyboard shortcuts
map super+shift+enter launch --cwd=current --type=os-window

# general
allow_remote_control false
enable_audio_bell no

# hints (URL handling)
detect_urls yes
url_prefixes file ftp gemini git gopher http https ipfs ipns magnet mailto news ssh
open_url_with xdg-open
copy_on_select yes


# Annoying ass exit confirm
confirm_os_window_close 0


# fonts
font_family JetBrains Mono NFM
font_size 12.0


# keybinds nahui

map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+f search_scrollback
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_command_output
map ctrl+shift+up scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1
map ctrl+shift+u kitten hints
map ctrl+shift+n launch --cwd=current --type=os-window
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Effective wallpaper palette; keep last so it overrides the fallback.
include ~/.cache/rebos_shell/kitty.conf

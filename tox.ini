[tox]
env_list = lint, quality, checks
skipsdist = true

[testenv]
skip_install = true
set_env =
    PYTHONDONTWRITEBYTECODE = 1

[testenv:lint]
deps = ruff==0.17.3
commands = ruff check --no-cache desktop system

[testenv:checks]
description = Verify payload, build native helpers and run desktop/media tests
system_site_packages = true
set_env =
    {[testenv]set_env}
    PYTHONPATH = {toxinidir}/system/apps/media
allowlist_externals =
    bash
    node
    lua5.1
commands =
    python desktop/scripts/deploy.py --verify
    bash -c 'set -e; for script in install.sh update.sh dev.sh desktop/install.sh oneline.sh desktop/scripts/finish-apps.sh docs/restore-windows-vm-passthrough.sh docs/windows-vm-passthrough/*.sh; do bash -n "$script"; done'
    bash desktop/scripts/build-check.sh
    python -m unittest discover -s desktop/tests -v
    python desktop/scripts/check_wayland.py
    python -m unittest discover -s desktop/tests/media -v
    python -m unittest discover -s system/apps/shell/scripts -p test_*.py -v
    python -m unittest discover -s system/apps/assistant/scripts -p test_*.py -v
    bash -c 'node --test desktop/tests/*.cjs system/apps/shell/scripts/test_*.cjs'
    lua5.1 desktop/tests/media/test_vlc_caption_anchor.lua

[testenv:quality]
description = Check design warnings and documented exception ceilings
deps = pylint==4.1.3
commands = python desktop/scripts/quality.py

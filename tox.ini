[tox]
env_list = lint, checks
skipsdist = true

[testenv]
skip_install = true
set_env =
    PYTHONDONTWRITEBYTECODE = 1

[testenv:lint]
deps = ruff==0.17.3
commands = ruff check --no-cache desktop system

[testenv:checks]
description = Verify payload, build native helpers and run desktop/media tests
system_site_packages = true
set_env =
    {[testenv]set_env}
    PYTHONPATH = {toxinidir}/system/apps/media
allowlist_externals = bash
commands =
    python desktop/scripts/deploy.py --verify
    bash -n install.sh desktop/install.sh oneline.sh desktop/scripts/finish-apps.sh
    bash desktop/scripts/build-check.sh
    python -m unittest discover -s desktop/tests -v
    python -m unittest discover -s desktop/tests/media -v
